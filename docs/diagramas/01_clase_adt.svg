<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560">
  <defs>
    <marker id="arrow-filled" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999" stroke="#999" stroke-width="0.5"/>
    </marker>
  </defs>

  <rect width="780" height="560" fill="#fafaf8" rx="8"/>

  <!-- Title -->
  <text x="390" y="18" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="11" fill="#888">Diagrama de clases - ADT del sistema</text>

  <!-- ====== FILA SUPERIOR ====== -->

  <!-- Incident -->
  <rect x="30" y="38" width="220" height="210" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <rect x="30" y="38" width="220" height="36" rx="6" fill="#e8f0fe"/>
  <rect x="30" y="68" width="220" height="6" fill="#e8f0fe"/>
  <line x1="30" y1="74" x2="250" y2="74" stroke="#555" stroke-width="1"/>
  <text x="140" y="62" text-anchor="middle" font-family="Consolas,monospace" font-size="13" font-weight="bold" fill="#1a1a1a">Incident</text>
  <text x="45" y="96" font-family="Consolas,monospace" font-size="11" fill="#333">+str id</text>
  <text x="45" y="116" font-family="Consolas,monospace" font-size="11" fill="#333">+str ubicacion</text>
  <text x="45" y="136" font-family="Consolas,monospace" font-size="11" fill="#333">+int prioridad</text>
  <text x="45" y="156" font-family="Consolas,monospace" font-size="11" fill="#333">+str tipo</text>
  <text x="45" y="176" font-family="Consolas,monospace" font-size="11" fill="#333">+datetime timestamp</text>
  <text x="45" y="196" font-family="Consolas,monospace" font-size="11" fill="#333">+EstadoIncidente estado</text>
  <line x1="30" y1="208" x2="250" y2="208" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="45" y="228" font-family="Consolas,monospace" font-size="11" fill="#333">+prioridad_efectiva(ahora) : float</text>
  <text x="45" y="246" font-family="Consolas,monospace" font-size="11" fill="#333">+horas_de_espera(ahora) : float</text>

  <!-- EstadoIncidente -->
  <rect x="470" y="63" width="210" height="155" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <rect x="470" y="63" width="210" height="36" rx="6" fill="#fef3e8"/>
  <rect x="470" y="93" width="210" height="6" fill="#fef3e8"/>
  <line x1="470" y1="99" x2="680" y2="99" stroke="#555" stroke-width="1"/>
  <text x="500" y="87" font-family="Consolas,monospace" font-size="12" font-weight="bold" fill="#1a1a1a">EstadoIncidente</text>
  <text x="500" y="68" font-family="Consolas,monospace" font-size="10" fill="#b45f06">&#171;enumeration&#187;</text>
  <text x="485" y="122" font-family="Consolas,monospace" font-size="11" fill="#333">PENDIENTE</text>
  <text x="485" y="142" font-family="Consolas,monospace" font-size="11" fill="#333">ASIGNADO</text>
  <text x="485" y="162" font-family="Consolas,monospace" font-size="11" fill="#333">ATENDIDO</text>
  <text x="485" y="182" font-family="Consolas,monospace" font-size="11" fill="#333">CANCELADO</text>

  <!-- Incident --> EstadoIncidente (filled arrow) -->
  <line x1="250" y1="140" x2="468" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-filled)"/>
  <text x="359" y="132" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#555">estado</text>

  <!-- ====== FILA INFERIOR ====== -->

  <!-- EmergencyCenter -->
  <rect x="30" y="318" width="220" height="115" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <rect x="30" y="318" width="220" height="36" rx="6" fill="#e8f0fe"/>
  <rect x="30" y="348" width="220" height="6" fill="#e8f0fe"/>
  <line x1="30" y1="354" x2="250" y2="354" stroke="#555" stroke-width="1"/>
  <text x="140" y="342" text-anchor="middle" font-family="Consolas,monospace" font-size="13" font-weight="bold" fill="#1a1a1a">EmergencyCenter</text>
  <text x="45" y="378" font-family="Consolas,monospace" font-size="11" fill="#333">+str id</text>
  <text x="45" y="398" font-family="Consolas,monospace" font-size="11" fill="#333">+str nombre</text>
  <text x="45" y="418" font-family="Consolas,monospace" font-size="11" fill="#333">+str ubicacion</text>

  <!-- RoadNetwork -->
  <rect x="410" y="308" width="280" height="210" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <rect x="410" y="308" width="280" height="36" rx="6" fill="#e8f0fe"/>
  <rect x="410" y="338" width="280" height="6" fill="#e8f0fe"/>
  <line x1="410" y1="344" x2="690" y2="344" stroke="#555" stroke-width="1"/>
  <text x="550" y="332" text-anchor="middle" font-family="Consolas,monospace" font-size="13" font-weight="bold" fill="#1a1a1a">RoadNetwork</text>
  <text x="425" y="366" font-family="Consolas,monospace" font-size="11" fill="#333">-dict adyacencia</text>
  <text x="425" y="386" font-family="Consolas,monospace" font-size="11" fill="#333">-dict coordenadas</text>
  <line x1="410" y1="398" x2="690" y2="398" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4,2"/>
  <text x="425" y="420" font-family="Consolas,monospace" font-size="11" fill="#333">+agregar_nodo(nodo, x, y)</text>
  <text x="425" y="440" font-family="Consolas,monospace" font-size="11" fill="#333">+agregar_arista(origen, dest, peso)</text>
  <text x="425" y="460" font-family="Consolas,monospace" font-size="11" fill="#333">+vecinos(nodo) : list</text>
  <text x="425" y="480" font-family="Consolas,monospace" font-size="11" fill="#333">+peso(origen, destino) : float</text>
  <text x="425" y="500" font-family="Consolas,monospace" font-size="11" fill="#333">+distancia_euclidiana(a, b) : float</text>

  <!-- ====== RELACIONES PUNTEADAS ====== -->

  <!-- Incident ..> RoadNetwork -->
  <path d="M 200,248 L 200,280 L 406,350" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="285" y="274" font-family="Consolas,monospace" font-size="9" fill="#999" text-anchor="middle">ubicacion es un nodo</text>

  <!-- EmergencyCenter ..> RoadNetwork -->
  <path d="M 250,375 L 406,375" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="328" y="367" font-family="Consolas,monospace" font-size="9" fill="#999" text-anchor="middle">ubicacion es un nodo</text>
</svg>
